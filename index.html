    const $ = (selector, root = document) => root.querySelector(selector);
    const $$ = (selector, root = document) => Array.from(root.querySelectorAll(selector));
    const escapeHTML = value => String(value).replace(/[&<>"']/g, char => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    })[char]);
    const safeHref = value => {
      try {
        const url = new URL(value, window.location.href);
        return ["https:", "http:", "mailto:", "tel:"].includes(url.protocol) ? escapeHTML(url.href) : "#";
      } catch {
        return "#";
      }
    };

    function setupInteractions() {
      const form = $("#inquiry-form");
      form.addEventListener("input", event => {
        if (event.target.matches("input, select, textarea")) event.target.setCustomValidity("");
        $("#form-status").classList.add("hidden");
      });
      form.addEventListener("submit", event => {
        event.preventDefault();
        $("#form-status").classList.add("hidden");
        if (!form.reportValidity()) return;
        $("#form-status").textContent = PORTFOLIO_DATA.contact.submitConfirmation;
        $("#form-status").classList.remove("hidden");
        form.reset();
        $("#experience-select").selectedIndex = 0;
        $("#program-select").selectedIndex = 0;
        $("#form-status").focus({ preventScroll: true });
      });

      const revealItems = $$(".reveal");
      if ("IntersectionObserver" in window && !window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
        const observer = new IntersectionObserver(entries => {
          entries.forEach(entry => {
            if (entry.isIntersecting) {
              entry.target.classList.add("is-visible");
              observer.unobserve(entry.target);
            }
          });
        }, { threshold: .12 });
        revealItems.forEach(item => {
          if (!item.classList.contains("reveal")) item.classList.add("reveal");
          observer.observe(item);
        });
      } else {
        revealItems.forEach(item => item.classList.add("is-visible"));
      }
    }

    renderPortfolio();
    setupInteractions();
    $("#portrait-image").addEventListener("error", () => {
      $("#portrait-image").style.display = "none";
