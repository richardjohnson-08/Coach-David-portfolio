          { type: "Workshop · 18 min", title: "From click to customer context", text: "A walkthrough of the decisions behind a useful bridge page, including what not to promise and what to measure.", icon: "presentation", url: "https://www.youtube.com/results?search_query=affiliate+marketing+funnel+education" },

      footer: {

    const $ = (selector, root = document) => root.querySelector(selector);
    const $$ = (selector, root = document) => Array.from(root.querySelectorAll(selector));
    const escapeHTML = value => String(value).replace(/[&<>"']/g, char => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    })[char]);
    const safeHref = value => {
      try {
        const url = new URL(value, window.location.href);
        return ["https:", "http:", "mailto:", "tel:"].includes(url.protocol) ? escapeHTML(url.href) : "#";
      } catch {
        return "#";
      }
    };
    const setTypewriterText = (element, text) => {
      element.classList.add("typewriter-target");
      element.dataset.typewriterText = text;
      element.innerHTML = `<span class="sr-only">${escapeHTML(text)}</span><span class="typewriter-visible" aria-hidden="true"></span>`;
    };

    function renderPortfolio() {
      const data = PORTFOLIO_DATA;
      $("#brand").innerHTML = `<img class="header-brand-avatar" src="${safeHref(data.person.avatar)}" alt=""><span class="border-l border-white/20 pl-3 font-heading text-sm font-bold tracking-tight text-slate-100">${escapeHTML(data.person.name)}</span>`;
      $("#footer-brand").textContent = data.person.name;
      $("#header-cta").href = "#proof-of-work";
      $("#advisory-cta").href = "#proof-of-work";
      const headline = $("#hero-headline");
      setTypewriterText(headline, data.person.headline);
      $("#portrait-image").src = data.person.portrait;
      $("#portrait-image").alt = `Portrait of ${data.person.name}`;
      $("#portrait-fallback").textContent = data.person.monogram;
      $("#portrait-name").textContent = data.person.name;
      $("#portrait-role").textContent = data.person.role;
      const socialMarkup = data.person.social.map(item => {
        const label = item.label === "WhatsApp" ? "demo contact" : "demo profile";
        return `<a class="inline-flex items-center gap-1.5 text-xs text-slate-400 transition hover:text-emerald-200" href="${safeHref(item.url)}" target="_blank" rel="noopener noreferrer" aria-label="${escapeHTML(item.label)} (${label})"><i class="social-brand-icon fa-brands fa-${escapeHTML(item.icon)}" aria-hidden="true"></i><span>${escapeHTML(item.label)}</span></a>`;
      }).join("");
      $("#hero-socials").innerHTML = socialMarkup;
      $("#footer-socials").innerHTML = data.person.social.map(item => {
        const label = item.label === "WhatsApp" ? "demo contact" : "demo profile";
        return `<a href="${safeHref(item.url)}" target="_blank" rel="noopener noreferrer" aria-label="${escapeHTML(item.label)} (${label})" class="text-slate-400 transition hover:text-emerald-200"><i class="social-brand-icon fa-brands fa-${escapeHTML(item.icon)}" aria-hidden="true"></i></a>`;
      }).join("");
      $("#stats-grid").innerHTML = data.stats.map(stat => `<div class="stat-cell"><span class="stat-value">${escapeHTML(stat.value)}</span><span class="stat-label">${escapeHTML(stat.label)}</span></div>`).join("");
      $("#proof-grid").innerHTML = data.proofResults.map((item, index) => {
        const media = item.type === "video"
          ? `<video src="${safeHref(item.media)}" autoplay muted loop playsinline preload="metadata" aria-label="Student review media ${index + 1}"></video>`
          : `<img src="${safeHref(item.media)}" alt="Student review media ${index + 1}" loading="lazy">`;
        return `<button class="proof-card surface rounded-lg" type="button" data-proof-index="${index}" aria-label="Open student review media ${index + 1}">
          <span class="proof-media-frame aspect-[9/16]">
            ${media}
            <span class="proof-media-fallback hidden" aria-hidden="true"></span>
          </span>
        </button>`;
      }).join("");
      $$(".proof-media-frame > img, .proof-media-frame > video").forEach(media => {
        media.addEventListener("error", () => {
          media.hidden = true;
          media.parentElement.querySelector(".proof-media-fallback").classList.remove("hidden");
        }, { once: true });
      });
      $("#about-title").textContent = data.about.title;
      $("#about-lead").textContent = data.about.lead;
      $("#about-story").innerHTML = data.about.story.map(paragraph => `<p>${escapeHTML(paragraph)}</p>`).join("");
      $("#about-quote").textContent = data.about.quote;
      $("#copyright").textContent = data.footer.copyright;
      if (window.lucide) window.lucide.createIcons();
    }

    function setupInteractions() {
      const typewriterTargets = $$(".typewriter-target");
      function startTypewriter(element) {
        const output = $(".typewriter-visible", element);
        const text = element.dataset.typewriterText;
        if (!output || !text || element.dataset.typingStarted === "true") return Promise.resolve();
        element.dataset.typingStarted = "true";
        output.classList.add("typing-active");
        return new Promise(resolve => {
          let character = 0;
          function typeNextCharacter() {
            character += 1;
            output.textContent = text.slice(0, character);
            if (character < text.length) {
              window.setTimeout(typeNextCharacter, 24);
            } else {
              output.classList.remove("typing-active");
              resolve();
            }
          }
          typeNextCharacter();
        });
      }
      const proofLightbox = $("#proof-lightbox");
      const proofLightboxTitle = $("#proof-lightbox-title");
      const proofLightboxMedia = $("#proof-lightbox-media");
      $("#proof-grid").addEventListener("click", event => {
        const card = event.target.closest("[data-proof-index]");
        if (!card) return;
        const proof = PORTFOLIO_DATA.proofResults[Number(card.dataset.proofIndex)];
        if (!proof) return;
        proofLightboxTitle.textContent = "Student review media";
        const media = document.createElement(proof.type === "video" ? "video" : "img");
        media.src = proof.media;
        if (proof.type === "video") {
          media.autoplay = true;
          media.muted = true;
          media.loop = true;
          media.playsInline = true;
          media.controls = true;
          media.setAttribute("aria-label", proof.headline);
        } else {
          media.alt = proof.headline;
        }
        media.addEventListener("error", () => {
          media.hidden = true;
        }, { once: true });
        proofLightboxMedia.replaceChildren(media);
        proofLightbox.showModal();
      });
      $("#proof-lightbox-close").addEventListener("click", () => proofLightbox.close());
      proofLightbox.addEventListener("click", event => {
        if (event.target === proofLightbox) proofLightbox.close();
      });
      proofLightbox.addEventListener("close", () => proofLightboxMedia.replaceChildren());

      const revealItems = $$(".reveal");
      if ("IntersectionObserver" in window && !window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
        const observer = new IntersectionObserver(entries => {
          entries.forEach(entry => {
            if (entry.isIntersecting) {
              if (entry.target.matches(".typewriter-target")) {
                startTypewriter(entry.target);
              } else {
                entry.target.classList.add("is-visible");
              }
              observer.unobserve(entry.target);
            }
          });
        }, { threshold: .12 });
        [...revealItems, ...typewriterTargets].forEach(item => observer.observe(item));
      } else {
        revealItems.forEach(item => item.classList.add("is-visible"));
        typewriterTargets.forEach(item => {
          $(".typewriter-visible", item).textContent = item.dataset.typewriterText;
        });
      }
    }

    renderPortfolio();
    setupInteractions();
    $("#portrait-image").addEventListener("error", () => {
      $("#portrait-image").style.display = "none";
    });
